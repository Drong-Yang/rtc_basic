name: voice-commerce-tools
services:
  attu:
    image: zilliz/attu:v2.4.12
    container_name: project1-milvus-attu
    ports:
      - "127.0.0.1:8081:3000"
    environment:
      MILVUS_URL: ${ATTU_MILVUS_ADDRESS:-host.docker.internal:19530}
      DATABASE: default
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
